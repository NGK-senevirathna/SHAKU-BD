<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff9a9e">
<title>💖 For My Love 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600;700&family=Pacifico&family=Noto+Sans+Sinhala:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff6b9d;
    --pink-light: #ffb6c1;
    --pink-dark: #e91e63;
    --purple: #c77dff;
    --cream: #fff5f7;
    --gold: #ffd700;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; }
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ffd1ff 100%);
    background-attachment: fixed;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    color: #4a2c4a;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
  }

  /* ===== FLOATING BACKGROUND STUFF ===== */
  .fx-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
  .float {
    position: absolute; bottom: -70px;
    animation: rise var(--d, 8s) linear forwards;
    will-change: transform;
  }
  @keyframes rise {
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    8%   { opacity: .95; }
    25%  { transform: translate(var(--sway, 20px), -28vh) rotate(calc(var(--rot, 20deg) * .3)); }
    50%  { transform: translate(calc(var(--sway, 20px) * -1), -58vh) rotate(calc(var(--rot, 20deg) * -.3)); }
    75%  { transform: translate(var(--sway, 20px), -88vh) rotate(calc(var(--rot, 20deg) * .3)); }
    100% { transform: translate(0, -125vh) rotate(var(--rot, 20deg)); opacity: .9; }
  }
  .fall {
    position: absolute; top: -40px;
    animation: fallDown var(--d, 6s) linear forwards;
  }
  @keyframes fallDown {
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: translate(var(--sway, 30px), 112vh) rotate(var(--rot, 360deg)); opacity: .9; }
  }
  .twinkle {
    position: absolute; animation: twinkle var(--d, 2s) ease-in-out infinite;
    animation-delay: var(--dl, 0s);
  }
  @keyframes twinkle {
    0%,100% { opacity: .1; transform: scale(.6) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.2) rotate(30deg); }
  }

  /* tap bursts + sparkle trail */
  .fx {
    position: fixed; pointer-events: none; z-index: 5000;
    animation: burst var(--t, .9s) ease-out forwards;
    left: 0; top: 0; will-change: transform, opacity;
  }
  @keyframes burst {
    from { transform: translate(calc(var(--x) - 50%), calc(var(--y) - 50%)) scale(.4); opacity: 1; }
    to   { transform: translate(calc(var(--x) + var(--dx) - 50%), calc(var(--y) + var(--dy) - 50%)) scale(1.3) rotate(var(--r, 90deg)); opacity: 0; }
  }
  .confetti {
    position: fixed; top: -14px; width: 10px; height: 14px; z-index: 4000; pointer-events: none;
    animation: confettiFall var(--d, 3s) linear forwards;
  }
  @keyframes confettiFall {
    to { transform: translate(var(--dx, 0px), 110vh) rotate(var(--r, 720deg)); opacity: .8; }
  }

  /* ===== LOCK SCREEN ===== */
  #lockScreen {
    position: fixed; inset: 0;
    background: linear-gradient(160deg, #ff9a9e, #fad0c4, #ffd1ff);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 1000;
    padding: calc(16px + var(--safe-top)) 16px calc(16px + var(--safe-bottom));
    transition: opacity .9s, transform .9s;
    overflow: hidden;
  }
  #lockScreen.hide { opacity: 0; transform: scale(1.15); pointer-events: none; }
  .lock-box {
    position: relative; z-index: 3;
    background: rgba(255,255,255,0.93);
    border-radius: 28px;
    padding: 30px 24px;
    width: 100%; max-width: 360px;
    box-shadow: 0 25px 50px rgba(233,30,99,0.25), 0 0 0 1px rgba(255,255,255,0.6);
    text-align: center;
    animation: floatIn .9s ease;
  }
  .lock-box.shake { animation: shake .5s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-12px); } 40% { transform: translateX(12px); }
    60% { transform: translateX(-8px); } 80% { transform: translateX(8px); }
  }
  @keyframes floatIn {
    from { opacity: 0; transform: translateY(30px) scale(.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .lock-icon { font-size: 60px; margin-bottom: 8px; animation: pulse 1.6s infinite; display: inline-block; }
  @keyframes pulse { 0%,100% { transform: scale(1) rotate(-4deg); } 50% { transform: scale(1.14) rotate(4deg); } }
  .lock-title { font-family: 'Pacifico', cursive; font-size: 1.7rem; color: var(--pink-dark); margin-bottom: 4px; }
  .lock-sub { font-size: .9rem; color: #888; margin-bottom: 20px; }
  .input-group { margin-bottom: 14px; text-align: left; }
  .input-group label { display: block; font-size: .8rem; font-weight: 600; color: var(--pink-dark); margin-bottom: 6px; }
  .input-group input {
    width: 100%; padding: 14px 16px;
    border: 2px solid #ffcce0; border-radius: 14px;
    font-size: 16px; /* 16px stops iOS zooming in */
    font-family: inherit; outline: none; background: #fff;
    -webkit-user-select: text; user-select: text;
    transition: border .3s, box-shadow .3s;
  }
  .input-group input:focus { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(255,107,157,.2); }
  .unlock-btn {
    width: 100%; padding: 16px;
    background: linear-gradient(135deg, #ff6b9d, #c77dff);
    color: #fff; border: none; border-radius: 14px;
    font-size: 1.1rem; font-weight: 600; font-family: inherit; cursor: pointer; margin-top: 6px;
    box-shadow: 0 8px 20px rgba(233,30,99,.35);
    animation: btnBeat 1.4s ease-in-out infinite;
  }
  .unlock-btn:active { transform: scale(.96); }
  @keyframes btnBeat { 0%,100% { transform: scale(1); } 50% { transform: scale(1.03); } }
  .error-msg { color: #e53935; font-size: .85rem; margin-top: 10px; min-height: 20px; opacity: 0; transition: opacity .3s; }
  .error-msg.show { opacity: 1; }

  /* ===== MAIN ===== */
  #mainCard {
    display: none; position: relative; z-index: 2;
    min-height: 100vh; min-height: 100dvh;
    padding: calc(12px + var(--safe-top)) 14px calc(40px + var(--safe-bottom));
    max-width: 520px; margin: 0 auto;
  }
  #mainCard.show { display: block; animation: fadeIn 1.2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .header { text-align: center; padding: 16px 6px 4px; }
  .header h1 {
    font-family: 'Pacifico', cursive;
    font-size: clamp(1.6rem, 8vw, 2.4rem);
    line-height: 1.25;
    background: linear-gradient(135deg, #e91e63, #9c27b0, #e91e63);
    background-size: 200% auto;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 4s linear infinite;
  }
  @keyframes shine { to { background-position: 200% center; } }
  .header p { font-size: .95rem; color: #7a4a6a; margin-top: 4px; }
  .bounce-letters span { display: inline-block; animation: hop 1.8s ease-in-out infinite; }
  @keyframes hop { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-10px); } }

  .photo-section { display: flex; justify-content: center; margin: 46px 0 40px; }
  .photo-wrap { position: relative; width: min(46vw, 180px); height: min(54vw, 212px); }
  .photo-frame {
    position: absolute; inset: 0;
    border-radius: 22px; overflow: hidden;
    border: 5px solid #fff;
    box-shadow: 0 15px 35px rgba(233,30,99,.3);
    animation: heartbeat 1.6s ease-in-out infinite;
    background: #ffe0ec;
  }
  @keyframes heartbeat {
    0%,100% { transform: scale(1); box-shadow: 0 15px 35px rgba(233,30,99,.3); }
    15% { transform: scale(1.05); box-shadow: 0 15px 50px rgba(233,30,99,.55); }
    30% { transform: scale(1); }
    45% { transform: scale(1.04); box-shadow: 0 15px 45px rgba(199,125,255,.5); }
  }
  .photo-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .orbit { position: absolute; inset: 0; animation: spin 14s linear infinite; pointer-events: none; }
  .orbit.rev { animation-direction: reverse; animation-duration: 20s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .orbit span {
    position: absolute; left: 50%; top: 50%; font-size: 22px; margin: -13px 0 0 -13px;
    transform: rotate(calc(var(--i) * 45deg)) translateY(calc(-1 * var(--rad, 125px)));
  }
  .photo-badge { position: absolute; bottom: -14px; right: -14px; font-size: 34px; animation: wiggle 1.4s ease-in-out infinite; filter: drop-shadow(0 2px 4px rgba(0,0,0,.2)); }
  .photo-crown { position: absolute; top: -34px; left: 50%; font-size: 36px; transform: translateX(-50%); animation: crown 2s ease-in-out infinite; }
  @keyframes crown { 0%,100% { transform: translateX(-50%) rotate(-8deg) translateY(0); } 50% { transform: translateX(-50%) rotate(8deg) translateY(-6px); } }
  @keyframes wiggle { 0%,100% { transform: rotate(-12deg) scale(1); } 50% { transform: rotate(12deg) scale(1.2); } }

  .music-bar {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin: 6px auto 14px; max-width: 300px;
    background: rgba(255,255,255,.88); padding: 8px 16px; border-radius: 50px;
    box-shadow: 0 6px 16px rgba(0,0,0,.08);
  }
  .music-btn {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, #ff6b9d, #c77dff); color: #fff; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(233,30,99,.3);
  }
  .music-btn.playing { animation: pulse 1s infinite; }
  .music-label { font-size: .85rem; color: #666; }
  .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 16px; margin-left: 2px; }
  .eq i { width: 3px; background: var(--pink); border-radius: 2px; height: 4px; animation: eq .8s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: .2s; } .eq i:nth-child(3) { animation-delay: .4s; } .eq i:nth-child(4) { animation-delay: .1s; }
  .eq.off i { animation: none; }
  @keyframes eq { 0%,100% { height: 4px; } 50% { height: 16px; } }

  .wish-card {
    background: rgba(255,255,255,.92); border-radius: 24px; padding: 22px 18px; margin: 14px auto;
    box-shadow: 0 12px 30px rgba(233,30,99,.15); text-align: center; position: relative; overflow: hidden;
  }
  .wish-card::before {
    content: ''; position: absolute; inset: -50%;
    background: conic-gradient(from 0deg, transparent, rgba(255,182,193,.25), transparent 30%);
    animation: spin 8s linear infinite; pointer-events: none;
  }
  .wish-card > * { position: relative; }
  .wish-card h2 { font-family: 'Dancing Script', cursive; font-size: 1.8rem; color: var(--pink-dark); margin-bottom: 10px; }
  .wish-text { font-size: .98rem; line-height: 1.7; color: #5a3a5a; min-height: 150px; text-align: left; }
  .wish-text p { margin-bottom: 8px; }
  .cursor { display: inline-block; width: 2px; height: 1em; background: var(--pink-dark); vertical-align: -2px; animation: blink .8s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .signature { font-family: 'Dancing Script', cursive; font-size: 1.5rem; color: var(--purple); margin-top: 12px; text-align: center; }

  .action-row { display: flex; gap: 10px; margin: 14px 0; }
  .big-btn {
    flex: 1; border: none; padding: 14px 8px; border-radius: 18px;
    background: linear-gradient(135deg, #ff6b9d, #c77dff); color: #fff;
    font-family: inherit; font-weight: 600; font-size: .92rem; cursor: pointer;
    box-shadow: 0 8px 18px rgba(233,30,99,.3);
  }
  .big-btn:active { transform: scale(.95); }
  .big-btn.alt { background: linear-gradient(135deg, #ffb347, #ff6b9d); }

  .reason-box {
    background: rgba(255,255,255,.9); border-radius: 18px; padding: 14px; text-align: center;
    min-height: 62px; font-size: .95rem; color: #5a3a5a; margin-bottom: 8px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px rgba(233,30,99,.1);
  }
  .reason-box.pop { animation: pop .5s; }
  @keyframes pop { 0% { transform: scale(.85); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }

  .games-title { text-align: center; font-family: 'Pacifico', cursive; font-size: 1.5rem; color: var(--pink-dark); margin: 24px 0 14px; }
  .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .game-btn {
    background: #fff; border: none; border-radius: 20px; padding: 16px 8px; cursor: pointer;
    box-shadow: 0 6px 18px rgba(233,30,99,.12);
    display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: inherit;
    animation: bob 3s ease-in-out infinite; animation-delay: var(--dl, 0s);
  }
  .game-btn:active { transform: scale(.94); }
  .game-btn .emoji { font-size: 34px; }
  .game-btn .name { font-size: .82rem; font-weight: 600; color: #5a3a5a; text-align: center; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

  .footer { text-align: center; padding: 22px 10px; font-size: .85rem; color: #9a6a8a; }

  /* ===== MODAL (bottom sheet on phones) ===== */
  .modal {
    display: none; position: fixed; inset: 0; background: rgba(60,0,40,.55);
    z-index: 2000; align-items: flex-end; justify-content: center;
  }
  .modal.open { display: flex; }
  .modal-content {
    background: #fff; width: 100%; max-width: 480px;
    max-height: 92vh; max-height: 92dvh; overflow-y: auto; overflow-x: hidden;
    border-radius: 28px 28px 0 0;
    padding: 22px 16px calc(24px + var(--safe-bottom)); position: relative;
    animation: sheetIn .4s cubic-bezier(.2,.9,.3,1.2);
    -webkit-user-select: none; user-select: none;
  }
  @keyframes sheetIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @media (min-height: 700px) and (min-width: 600px) {
    .modal { align-items: center; padding: 16px; }
    .modal-content { border-radius: 28px; }
  }
  .modal-close {
    position: absolute; top: 12px; right: 12px; background: #ffe0ec; border: none;
    width: 38px; height: 38px; border-radius: 50%; font-size: 18px; cursor: pointer; color: var(--pink-dark); z-index: 5;
  }
  .modal-title { font-family: 'Pacifico', cursive; font-size: 1.35rem; color: var(--pink-dark); text-align: center; margin: 0 40px 14px; }
  .game-area { min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; }
  .score-display { font-size: 1.1rem; font-weight: 600; color: var(--pink-dark); margin-bottom: 10px; text-align: center; }
  .hint { font-size: .8rem; color: #999; margin-bottom: 8px; text-align: center; }
  .play-area {
    width: 100%; height: min(52vh, 340px); background: linear-gradient(to bottom, #e0f7fa, #fff0f8);
    border-radius: 18px; position: relative; overflow: hidden; border: 2px solid #ffcce0; touch-action: none;
  }
  .play-area .item { position: absolute; cursor: pointer; line-height: 1; }
  .balloon-up { animation: balloonUp var(--d, 4s) linear forwards; bottom: -60px; }
  @keyframes balloonUp { to { transform: translateY(calc(-1 * min(52vh, 340px) - 90px)) rotate(var(--rot, 10deg)); } }
  .basket { position: absolute; bottom: 4px; font-size: 44px; transform: translateX(-50%); }
  .result-msg {
    margin-top: 14px; padding: 12px 14px; background: #fff0f5; border-radius: 14px; font-size: .95rem; line-height: 1.5;
    min-height: 56px; text-align: center; width: 100%;
  }
  .restart-btn {
    margin-top: 12px; padding: 12px 26px; border: none; border-radius: 30px; font-family: inherit;
    background: linear-gradient(135deg, #ff6b9d, #c77dff); color: #fff; font-weight: 600; cursor: pointer;
    box-shadow: 0 6px 16px rgba(233,30,99,.3);
  }

  /* memory */
  .memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; max-width: 320px; }
  .memory-card { aspect-ratio: 1; perspective: 600px; cursor: pointer; }
  .memory-inner { position: relative; width: 100%; height: 100%; transition: transform .45s; transform-style: preserve-3d; }
  .memory-card.flipped .memory-inner, .memory-card.matched .memory-inner { transform: rotateY(180deg); }
  .memory-face {
    position: absolute; inset: 0; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    backface-visibility: hidden; -webkit-backface-visibility: hidden; font-size: 26px;
  }
  .memory-front { background: linear-gradient(135deg, #ff6b9d, #c77dff); color: #fff; }
  .memory-back { background: #fff; border: 2px solid var(--pink); transform: rotateY(180deg); }
  .memory-card.matched .memory-back { background: #fff0f5; animation: pop .5s; }

  /* wheel */
  .wheel-container { position: relative; width: min(70vw, 260px); height: min(70vw, 260px); margin: 8px auto 0; }
  .wheel {
    width: 100%; height: 100%; border-radius: 50%; border: 6px solid var(--pink); position: relative;
    transition: transform 4.2s cubic-bezier(.17,.67,.12,.99);
    background: conic-gradient(#ff6b9d 0deg 90deg, #c77dff 90deg 180deg, #ffb6c1 180deg 270deg, #ffd700 270deg 360deg);
    box-shadow: 0 10px 30px rgba(233,30,99,.3);
  }
  .wheel span {
    position: absolute; left: 50%; top: 50%; font-size: 30px; margin: -17px 0 0 -17px;
    transform: rotate(var(--a)) translateY(calc(min(70vw, 260px) * -.28));
  }
  .wheel-pointer { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 30px; z-index: 2; animation: bob 1s infinite; }
  .wheel-hub { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px; background: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 2px 8px rgba(0,0,0,.2); z-index: 2; }

  /* quiz */
  .quiz-q { font-weight: 600; margin-bottom: 8px; text-align: center; color: #5a3a5a; }
  .quiz-option {
    display: block; width: 100%; padding: 13px; margin: 7px 0; background: #fff0f5; border: 2px solid #ffcce0;
    border-radius: 14px; cursor: pointer; font-size: .95rem; text-align: left; font-family: inherit; color: #4a2c4a;
  }
  .quiz-option:active { background: #ffe0ec; transform: scale(.98); }

  /* cake */
  .cake-stage { position: relative; text-align: center; padding-top: 30px; }
  .candles { display: flex; gap: 14px; justify-content: center; }
  .candle { font-size: 38px; cursor: pointer; display: inline-block; animation: flicker .6s ease-in-out infinite alternate; transform-origin: bottom center; }
  .candle.out { animation: none; filter: grayscale(1); opacity: .6; }
  .candle.out::after { content: '💨'; position: absolute; font-size: 20px; margin: -42px 0 0 -10px; animation: smoke 1.2s ease-out forwards; }
  @keyframes flicker { from { transform: rotate(-4deg) scale(1); } to { transform: rotate(4deg) scale(1.1); } }
  @keyframes smoke { to { transform: translateY(-40px); opacity: 0; } }
  .cake-emoji { font-size: 90px; cursor: pointer; display: inline-block; animation: bob 2s ease-in-out infinite; }
  .cake-emoji.cut { animation: cakeShake .6s; }
  @keyframes cakeShake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-10deg) scale(1.1); } 75% { transform: rotate(10deg) scale(1.1); } }

  /* kiss */
  .kiss-btn {
    font-size: 100px; background: none; border: none; cursor: pointer; line-height: 1;
    animation: pulse 1.2s ease-in-out infinite; filter: drop-shadow(0 8px 14px rgba(233,30,99,.4));
  }
  .kiss-btn:active { transform: scale(1.3); }
  .love-meter { width: 100%; height: 22px; background: #ffe0ec; border-radius: 12px; overflow: hidden; margin: 10px 0; }
  .love-fill { height: 100%; background: linear-gradient(90deg, #ff6b9d, #c77dff); width: 0%; transition: width .3s; border-radius: 12px; }

  /* letter */
  .envelope { font-size: 100px; cursor: pointer; display: inline-block; animation: bob 1.6s ease-in-out infinite; }
  .letter {
    margin-top: 10px; background: #fffaf0; border: 2px dashed #ffb6c1; border-radius: 16px; padding: 16px; text-align: left;
    font-family: 'Noto Sans Sinhala', 'Poppins', sans-serif; font-size: 1rem; line-height: 1.95; color: #6a3a5a; width: 100%; min-height: 180px;
    white-space: pre-wrap; -webkit-user-select: text; user-select: text;
  }

  @media (prefers-reduced-motion: reduce) {
    .float, .fall, .twinkle { animation-duration: 20s !important; }
  }
</style>
</head>
<body>

<!-- Song: keep the mp3 file in the same folder as this html file -->
<audio id="myBirthdaySong" loop preload="auto" playsinline src="husme-samada-randuna-sandanari-harsha-withanage%20(1).mp3"></audio>

<!-- background effects layer -->
<div class="fx-layer" id="bgLayer"></div>

<!-- ===== LOCK SCREEN ===== -->
<div id="lockScreen">
  <div class="fx-layer" id="lockHearts"></div>
  <div class="lock-box" id="lockBox">
    <div class="lock-icon">🔐💖</div>
    <div class="lock-title">Secret Lock</div>
    <div class="lock-sub">Only my special girl can open this 💕</div>
    <div class="input-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter username" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
    </div>
    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" inputmode="numeric">
    </div>
    <button class="unlock-btn" id="unlockBtn">Unlock My Heart 💝</button>
    <div class="error-msg" id="errorMsg">Wrong username or password 💔</div>
  </div>
</div>

<!-- ===== MAIN CARD ===== -->
<div id="mainCard">
  <div class="header">
    <h1 class="bounce-letters" id="titleText"></h1>
    <p>A special gift just for you ✨</p>
  </div>

  <div class="photo-section">
    <div class="photo-wrap">
      <div class="orbit" id="orbit1"></div>
      <div class="orbit rev" id="orbit2"></div>
      <div class="photo-crown">👑</div>
      <div class="photo-frame">
        <img src="photo.png" alt="My Love" onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'230\'><rect width=\'100%\' height=\'100%\' fill=\'%23ffe0ec\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' font-size=\'60\'>💖</text></svg>'">
      </div>
      <div class="photo-badge">💕</div>
    </div>
  </div>

  <div class="music-bar">
    <button class="music-btn" id="musicToggle" aria-label="Play or pause music">▶️</button>
    <span class="music-label" id="musicLabel">Play our song</span>
    <span class="eq off" id="eq"><i></i><i></i><i></i><i></i></span>
  </div>

  <div class="wish-card">
    <h2>To My Dearest Love 🌸</h2>
    <div class="wish-text" id="wishText"></div>
    <div class="signature">Forever Yours ❤️</div>
  </div>

  <div class="action-row">
    <button class="big-btn" id="reasonBtn">💌 Why I love you</button>
    <button class="big-btn alt" id="shower">🎈 Love Shower</button>
  </div>
  <button class="big-btn" id="letterBtn" style="width:100%;margin:0 0 12px;font-size:1rem;animation:btnBeat 1.4s ease-in-out infinite">💌 මගේ හදවතින් ලියපු ලියුම</button>
  <div class="reason-box" id="reasonBox">Tap the button to see a reason 🥰</div>

  <div class="games-title">Fun Surprises For You 🎁</div>
  <div class="games-grid">
    <button class="game-btn" style="--dl:0s"   data-game="balloons"><span class="emoji">🎈</span><span class="name">Pop Balloons</span></button>
    <button class="game-btn" style="--dl:.3s"  data-game="kiss"><span class="emoji">💋</span><span class="name">Kiss Machine</span></button>
    <button class="game-btn" style="--dl:.6s"  data-game="catch"><span class="emoji">💖</span><span class="name">Catch Hearts</span></button>
    <button class="game-btn" style="--dl:.9s"  data-game="memory"><span class="emoji">🧩</span><span class="name">Memory Match</span></button>
    <button class="game-btn" style="--dl:1.2s" data-game="wheel"><span class="emoji">🎡</span><span class="name">Love Wheel</span></button>
    <button class="game-btn" style="--dl:1.5s" data-game="quiz"><span class="emoji">❓</span><span class="name">Love Quiz</span></button>
    <button class="game-btn" style="--dl:1.8s" data-game="cake"><span class="emoji">🎂</span><span class="name">Birthday Cake</span></button>
    <button class="game-btn" style="--dl:2.1s" data-game="letter"><span class="emoji">💌</span><span class="name">Love Letter</span></button>
  </div>

  <div class="footer">Made with all my love for you ✨<br>Tap anywhere for a surprise 💕</div>
</div>

<!-- MODAL -->
<div class="modal" id="gameModal">
  <div class="modal-content">
    <button class="modal-close" id="closeBtn" aria-label="Close">✕</button>
    <div class="modal-title" id="modalTitle">Game</div>
    <div class="game-area" id="gameArea"></div>
  </div>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const rand = (a, b) => Math.random() * (b - a) + a;
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const song = $('myBirthdaySong');
  let unlocked = false;

  /* ================= PARTICLES ================= */
  function burst(x, y, emojis, n, spread) {
    emojis = emojis || ['💖','💕','💋','✨','💗'];
    n = n || 8; spread = spread || 90;
    for (let i = 0; i < n; i++) {
      const e = document.createElement('div');
      e.className = 'fx';
      e.textContent = pick(emojis);
      const ang = Math.random() * Math.PI * 2, dist = rand(spread * .5, spread * 1.4);
      e.style.setProperty('--x', x + 'px');
      e.style.setProperty('--y', y + 'px');
      e.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      e.style.setProperty('--dy', Math.sin(ang) * dist - 30 + 'px');
      e.style.setProperty('--r', rand(-200, 200) + 'deg');
      e.style.setProperty('--t', rand(.7, 1.2) + 's');
      e.style.fontSize = rand(16, 30) + 'px';
      document.body.appendChild(e);
      setTimeout(() => e.remove(), 1300);
    }
  }
  function confetti(n) {
    const colors = ['#ff6b9d','#c77dff','#ffd700','#ffb6c1','#7fdbff','#fff'];
    for (let i = 0; i < (n || 70); i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = rand(0, 100) + 'vw';
      c.style.background = pick(colors);
      c.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
      c.style.setProperty('--d', rand(2.2, 4.2) + 's');
      c.style.setProperty('--dx', rand(-80, 80) + 'px');
      c.style.setProperty('--r', rand(360, 1080) + 'deg');
      c.style.animationDelay = rand(0, 1) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 6000);
    }
  }

  /* floating things that rise (balloons, hearts, kisses) */
  const RISERS = ['🎈','🎈','🎈','💖','💋','💕','💗','🎀','🌸','🦋','💝'];
  const FALLERS = ['💖','💋','✨','🌸','💕','⭐','💗'];
  function spawnRiser(layer, sizeMin, sizeMax) {
    const e = document.createElement('div');
    e.className = 'float';
    e.textContent = pick(RISERS);
    e.style.left = rand(0, 94) + 'vw';
    e.style.fontSize = rand(sizeMin || 22, sizeMax || 46) + 'px';
    e.style.setProperty('--d', rand(7, 12) + 's');
    e.style.setProperty('--sway', rand(12, 40) + 'px');
    e.style.setProperty('--rot', rand(-40, 40) + 'deg');
    layer.appendChild(e);
    setTimeout(() => e.remove(), 12500);
  }
  function spawnFaller(layer) {
    const e = document.createElement('div');
    e.className = 'fall';
    e.textContent = pick(FALLERS);
    e.style.left = rand(0, 95) + 'vw';
    e.style.fontSize = rand(14, 26) + 'px';
    e.style.setProperty('--d', rand(6, 10) + 's');
    e.style.setProperty('--sway', rand(-50, 50) + 'px');
    e.style.setProperty('--rot', rand(-360, 360) + 'deg');
    layer.appendChild(e);
    setTimeout(() => e.remove(), 10500);
  }
  function addTwinkles(layer, n) {
    for (let i = 0; i < n; i++) {
      const t = document.createElement('div');
      t.className = 'twinkle';
      t.textContent = pick(['✨','⭐','💫']);
      t.style.left = rand(0, 96) + 'vw';
      t.style.top = rand(0, 96) + 'vh';
      t.style.fontSize = rand(10, 20) + 'px';
      t.style.setProperty('--d', rand(1.5, 3.5) + 's');
      t.style.setProperty('--dl', rand(0, 3) + 's');
      layer.appendChild(t);
    }
  }

  /* lock screen ambience */
  const lockLayer = $('lockHearts');
  addTwinkles(lockLayer, 14);
  for (let i = 0; i < 6; i++) setTimeout(() => spawnRiser(lockLayer), i * 400);
  const lockTimer = setInterval(() => { spawnRiser(lockLayer); spawnFaller(lockLayer); }, 900);

  /* ================= MUSIC ================= */
  function setMusicUI(on) {
    $('musicToggle').textContent = on ? '⏸️' : '▶️';
    $('musicToggle').classList.toggle('playing', on);
    $('musicLabel').textContent = on ? 'Playing our song…' : 'Play our song';
    $('eq').classList.toggle('off', !on);
  }
  function playMusic() {
    song.volume = 0.9;
    const p = song.play();
    if (p && p.then) {
      p.then(() => setMusicUI(true)).catch(() => {
        setMusicUI(false);
        $('musicLabel').textContent = 'Tap anywhere to start the song 🎵';
        armFirstTap();
      });
    }
  }
  let tapArmed = false;
  function armFirstTap() {
    if (tapArmed) return; tapArmed = true;
    const once = () => {
      document.removeEventListener('pointerdown', once, true);
      tapArmed = false;
      if (song.paused && !userPaused) playMusic();
    };
    document.addEventListener('pointerdown', once, true);
  }
  let userPaused = false;
  $('musicToggle').addEventListener('click', e => {
    e.stopPropagation();
    if (song.paused) { userPaused = false; playMusic(); }
    else { userPaused = true; song.pause(); setMusicUI(false); }
  });
  song.addEventListener('play', () => setMusicUI(true));
  song.addEventListener('pause', () => setMusicUI(false));
  document.addEventListener('visibilitychange', () => {
    if (!unlocked) return;
    if (document.hidden) song.pause();
    else if (!userPaused) playMusic();
  });

  /* ================= UNLOCK ================= */
  function tryUnlock() {
    const user = $('username').value.trim();
    const pass = $('password').value.trim();
    if (user.toLowerCase() === 'shaku' && pass === '1012') {
      unlocked = true;
      playMusic();                       // user tapped -> autoplay is allowed
      $('lockScreen').classList.add('hide');
      $('mainCard').classList.add('show');
      clearInterval(lockTimer);
      setTimeout(() => $('lockScreen').remove(), 1000);
      startMain();
    } else {
      const box = $('lockBox');
      box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
      $('errorMsg').classList.add('show');
      setTimeout(() => $('errorMsg').classList.remove('show'), 2500);
    }
  }
  $('unlockBtn').addEventListener('click', tryUnlock);
  $('password').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
  $('username').addEventListener('keydown', e => { if (e.key === 'Enter') $('password').focus(); });

  /* ================= MAIN ================= */
  const WISH = [
    'Happy Birthday to the most amazing person in my life! Your smile lights up my entire world. 🌟',
    'Thank you for bringing so much love, happiness, and joy into my heart every single day. 💖',
    'I hope this year gives you every beautiful thing you deserve — and I want to be next to you for all of it. 🎂',
    'You are my favourite hello and my hardest goodbye. I love you more than words can say! 😘'
  ];
  const REASONS = [
    'Your smile makes my worst day better 😊',
    'You laugh at my silly jokes (even the bad ones) 😂',
    'You make me want to be a better person 💪',
    'Your hugs feel like home 🤗',
    'You are kind to everyone around you 🌸',
    'You make ordinary moments feel magical ✨',
    'The way you say my name 🥰',
    'You believe in me when I don’t 💖',
    'Every moment with you is my favourite 💕',
    'You are simply YOU — and that is perfect 👑'
  ];
  let riserTimer, fallerTimer;

  function startMain() {
    // bouncing title
    const t = 'Happy Birthday My Love 💖';
    $('titleText').innerHTML = [...t].map((c, i) =>
      c === ' ' ? ' ' : `<span style="animation-delay:${i * .08}s">${c}</span>`).join('');

    // orbiting emoji rings
    const ring1 = ['💖','🎈','💋','✨','💕','🎈','💗','⭐'];
    const ring2 = ['🦋','🌸','💋','🎀','🌸','💝','🦋','💫'];
    $('orbit1').style.setProperty('--rad', '120px');
    $('orbit2').style.setProperty('--rad', '150px');
    $('orbit1').innerHTML = ring1.map((e, i) => `<span style="--i:${i}">${e}</span>`).join('');
    $('orbit2').innerHTML = ring2.map((e, i) => `<span style="--i:${i}">${e}</span>`).join('');

    // background
    const bg = $('bgLayer');
    addTwinkles(bg, 18);
    for (let i = 0; i < 8; i++) setTimeout(() => spawnRiser(bg), i * 350);
    riserTimer = setInterval(() => spawnRiser(bg), 650);
    fallerTimer = setInterval(() => spawnFaller(bg), 1100);

    confetti(90);
    setTimeout(() => confetti(50), 1800);
    typeWish();
  }

  async function typeWish() {
    const box = $('wishText');
    box.innerHTML = '';
    for (const line of WISH) {
      const p = document.createElement('p');
      box.appendChild(p);
      const cur = document.createElement('span'); cur.className = 'cursor';
      for (const ch of line) {
        p.textContent += ch;
        p.appendChild(cur);
        await new Promise(r => setTimeout(r, 28));
      }
      cur.remove();
      await new Promise(r => setTimeout(r, 250));
    }
  }

  /* love shower */
  $('shower').addEventListener('click', () => {
    const bg = $('bgLayer');
    for (let i = 0; i < 26; i++) setTimeout(() => { spawnRiser(bg, 28, 56); if (i % 2) spawnFaller(bg); }, i * 90);
    confetti(60);
    const r = $('shower').getBoundingClientRect();
    burst(r.left + r.width / 2, r.top, ['🎈','💋','💖','🎉'], 14, 130);
  });

  $('letterBtn').addEventListener('click', () => openGame('letter'));

  /* reasons */
  let reasonIdx = 0;
  $('reasonBtn').addEventListener('click', () => {
    const box = $('reasonBox');
    box.textContent = REASONS[reasonIdx++ % REASONS.length];
    box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop');
    const r = box.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + 20, ['💖','💕','💋'], 8, 80);
  });

  /* tap anywhere = heart burst; drag = sparkle trail */
  document.addEventListener('pointerdown', e => {
    if (!unlocked || $('gameModal').classList.contains('open')) return;
    burst(e.clientX, e.clientY, ['💖','💋','🎈','✨','💕'], 7, 80);
  });
  let lastTrail = 0;
  document.addEventListener('pointermove', e => {
    if (!unlocked || e.pressure === 0 && e.pointerType === 'touch') return;
    if ($('gameModal').classList.contains('open')) return;
    const now = performance.now();
    if (now - lastTrail < 90) return; lastTrail = now;
    burst(e.clientX, e.clientY, ['✨','💖'], 1, 30);
  });

  /* ================= GAMES ================= */
  let cleanups = [];
  const later = (fn, ms) => { const id = setTimeout(fn, ms); cleanups.push(() => clearTimeout(id)); return id; };
  const every = (fn, ms) => { const id = setInterval(fn, ms); cleanups.push(() => clearInterval(id)); return id; };

  function closeGame() {
    cleanups.forEach(f => f()); cleanups = [];
    $('gameModal').classList.remove('open');
    $('gameArea').innerHTML = '';
  }
  $('closeBtn').addEventListener('click', closeGame);
  $('gameModal').addEventListener('pointerdown', e => { if (e.target === $('gameModal')) closeGame(); });
  document.querySelectorAll('[data-game]').forEach(b =>
    b.addEventListener('click', () => openGame(b.dataset.game)));

  function openGame(type) {
    cleanups.forEach(f => f()); cleanups = [];
    const area = $('gameArea'), title = $('modalTitle');
    area.innerHTML = '';
    $('gameModal').classList.add('open');
    ({ balloons, kiss, catchGame, memory, wheel, quiz, cake, letter })[type === 'catch' ? 'catchGame' : type](area, title);
  }

  /* ---- Pop balloons ---- */
  function balloons(area, title) {
    title.textContent = 'Pop the Balloons! 🎈';
    let score = 0, time = 25, over = false;
    area.innerHTML = `
      <div class="score-display">Popped: <span id="bScore">0</span> &nbsp;|&nbsp; ⏱ <span id="bTime">25</span>s</div>
      <div class="play-area" id="bArea"></div>
      <div class="result-msg" id="bMsg">Pop as many as you can! 💋💖🎈</div>`;
    const pa = $('bArea');
    const items = ['🎈','🎈','🎈','🎈','💖','💋','💜','🎀'];
    function spawn() {
      if (over) return;
      const el = document.createElement('div');
      el.className = 'item balloon-up';
      el.textContent = pick(items);
      el.style.left = rand(2, 84) + '%';
      el.style.fontSize = rand(40, 60) + 'px';
      el.style.setProperty('--d', rand(3, 5) + 's');
      el.style.setProperty('--rot', rand(-25, 25) + 'deg');
      el.addEventListener('pointerdown', ev => {
        ev.stopPropagation();
        score++; $('bScore').textContent = score;
        burst(ev.clientX, ev.clientY, ['💥','💖','💋','✨'], 6, 70);
        el.remove();
      });
      el.addEventListener('animationend', () => el.remove());
      pa.appendChild(el);
    }
    every(spawn, 420);
    every(() => {
      time--; $('bTime').textContent = time;
      if (time <= 0) {
        over = true;
        $('bMsg').innerHTML = `<b>You popped ${score} balloons! 🎉</b><br>Each one has a kiss inside 😘`;
        confetti(60);
        pa.innerHTML = '';
      }
    }, 1000);
  }

  /* ---- Kiss machine ---- */
  function kiss(area, title) {
    title.textContent = 'Kiss Machine 💋';
    let count = 0;
    const goals = { 10: 'Mwah! Warming up 😘', 25: 'So many kisses! 💕', 50: 'You are officially kissed 50 times! 🥰', 100: '💯 kisses delivered! I love you! 💖' };
    area.innerHTML = `
      <div class="score-display">Kisses sent: <span id="kCount">0</span></div>
      <button class="kiss-btn" id="kBtn">💋</button>
      <div class="love-meter"><div class="love-fill" id="kFill"></div></div>
      <div class="result-msg" id="kMsg">Tap the lips to send me kisses! 😘</div>`;
    $('kBtn').addEventListener('pointerdown', ev => {
      count++;
      $('kCount').textContent = count;
      $('kFill').style.width = Math.min(100, count) + '%';
      const r = $('kBtn').getBoundingClientRect();
      burst(r.left + r.width / 2, r.top + r.height / 2, ['💋','💋','💖','😘','💕'], 6, 120);
      if (goals[count]) { $('kMsg').textContent = goals[count]; confetti(40); }
    });
  }

  /* ---- Catch hearts ---- */
  function catchGame(area, title) {
    title.textContent = 'Catch the Hearts 💖';
    let score = 0, time = 30, over = false, bx = 0;
    area.innerHTML = `
      <div class="score-display">Score: <span id="cScore">0</span> &nbsp;|&nbsp; ⏱ <span id="cTime">30</span>s</div>
      <div class="hint">Slide your finger to move the basket. Avoid 💔!</div>
      <div class="play-area" id="cArea"><div class="basket" id="basket">🧺</div></div>
      <div class="result-msg" id="cMsg">Catch 💖 💋 🎈 — dodge 💔</div>`;
    const pa = $('cArea'), basket = $('basket');
    bx = pa.clientWidth / 2; basket.style.left = bx + 'px';
    const move = ev => {
      const r = pa.getBoundingClientRect();
      bx = Math.max(24, Math.min(r.width - 24, ev.clientX - r.left));
      basket.style.left = bx + 'px';
    };
    pa.addEventListener('pointermove', move);
    pa.addEventListener('pointerdown', move);

    const things = [];
    const types = ['💖','💖','💋','🎈','💔'];
    every(() => {
      if (over) return;
      const kind = pick(types);
      const el = document.createElement('div');
      el.className = 'item'; el.textContent = kind; el.style.fontSize = '30px';
      const x = rand(16, pa.clientWidth - 40);
      el.style.left = x + 'px'; el.style.top = '-30px';
      pa.appendChild(el);
      things.push({ el, x, y: -30, v: rand(2.2, 4.2), bad: kind === '💔' });
    }, 650);

    let raf;
    (function loop() {
      const h = pa.clientHeight;
      for (let i = things.length - 1; i >= 0; i--) {
        const t = things[i];
        t.y += t.v; t.el.style.top = t.y + 'px';
        if (t.y > h - 52 && t.y < h - 10 && Math.abs((t.x + 14) - bx) < 36) {
          if (t.bad) { score = Math.max(0, score - 2); }
          else { score++; }
          $('cScore').textContent = score;
          const r = t.el.getBoundingClientRect();
          burst(r.left, r.top, t.bad ? ['💔'] : ['✨','💖'], 4, 50);
          t.el.remove(); things.splice(i, 1);
        } else if (t.y > h) { t.el.remove(); things.splice(i, 1); }
      }
      if (!over) raf = requestAnimationFrame(loop);
    })();
    cleanups.push(() => cancelAnimationFrame(raf));

    every(() => {
      time--; $('cTime').textContent = time;
      if (time <= 0) {
        over = true;
        $('cMsg').innerHTML = `<b>Final score: ${score} 💖</b><br>You caught my heart long ago 😘`;
        confetti(60);
      }
    }, 1000);
  }

  /* ---- Memory match ---- */
  function memory(area, title) {
    title.textContent = 'Memory Match 🧩';
    const emojis = ['💖','🌸','💍','💋','🎈','🦋'];
    const cards = [...emojis, ...emojis].sort(() => Math.random() - .5);
    let first = null, lock = false, matches = 0, moves = 0;
    area.innerHTML = `<div class="score-display">Moves: <span id="mMoves">0</span></div><div class="memory-grid" id="mGrid"></div><div class="result-msg" id="mMsg">Find all the pairs! 💕</div>`;
    const grid = $('mGrid');
    cards.forEach(emoji => {
      const c = document.createElement('div');
      c.className = 'memory-card';
      c.dataset.emoji = emoji;
      c.innerHTML = `<div class="memory-inner"><div class="memory-face memory-front">❔</div><div class="memory-face memory-back">${emoji}</div></div>`;
      c.addEventListener('click', () => {
        if (lock || c.classList.contains('flipped') || c.classList.contains('matched')) return;
        c.classList.add('flipped');
        if (!first) { first = c; return; }
        moves++; $('mMoves').textContent = moves;
        if (first.dataset.emoji === c.dataset.emoji) {
          first.classList.add('matched'); c.classList.add('matched');
          const r = c.getBoundingClientRect();
          burst(r.left + r.width / 2, r.top + r.height / 2, ['💖','✨'], 6, 70);
          first = null; matches++;
          if (matches === emojis.length) {
            $('mMsg').innerHTML = `<b>You won in ${moves} moves! 🎉💖</b>`;
            confetti(80);
          }
        } else {
          lock = true;
          const a = first; first = null;
          later(() => { a.classList.remove('flipped'); c.classList.remove('flipped'); lock = false; }, 700);
        }
      });
      grid.appendChild(c);
    });
  }

  /* ---- Love wheel ---- */
  function wheel(area, title) {
    title.textContent = 'Love Wheel 🎡';
    const prizes = ['Infinite Hugs & Kisses! 🤗😘', 'A Dinner Date on me! 🍽️', 'A Special Gift! 🎁', 'Endless Love Forever! 💕'];
    const icons = ['🤗','🍽️','🎁','💕'];
    area.innerHTML = `
      <div class="wheel-container">
        <div class="wheel-pointer">👇</div>
        <div class="wheel" id="loveWheel">${icons.map((e, i) => `<span style="--a:${i * 90 + 45}deg">${e}</span>`).join('')}</div>
        <div class="wheel-hub">💖</div>
      </div>
      <button class="restart-btn" id="spinBtn">Spin the Wheel! ✨</button>
      <div class="result-msg" id="wheelResult"></div>`;
    let total = 0, spinning = false;
    $('spinBtn').addEventListener('click', () => {
      if (spinning) return; spinning = true;
      total += 1440 + Math.floor(Math.random() * 360);
      $('loveWheel').style.transform = `rotate(${total}deg)`;
      $('wheelResult').textContent = 'Spinning… 🤞';
      later(() => {
        const under = (360 - (total % 360)) % 360;       // slice under the pointer
        const idx = Math.floor(under / 90) % 4;
        $('wheelResult').innerHTML = '<b>' + prizes[idx] + '</b>';
        confetti(50);
        const r = $('loveWheel').getBoundingClientRect();
        burst(r.left + r.width / 2, r.top + 10, ['💖','🎉','💋'], 10, 120);
        spinning = false;
      }, 4300);
    });
  }

  /* ---- Quiz ---- */
  function quiz(area, title) {
    title.textContent = 'Love Quiz ❓';
    const qs = [
      { q: 'Who loves who more? 🥰', a: ['You love me more! ❤️', 'I love you more! 💖', 'We love each other equally! ♾️'], r: 'Correct! Our love is endless! 💖' },
      { q: 'What is my favourite thing in the world? 🌍', a: ['Pizza 🍕', 'You 😍', 'Sleeping 😴'], r: 'Aww, YOU of course! (Pizza is second) 😂' },
      { q: 'How many kisses do I want today? 💋', a: ['One', 'Ten', 'Infinite'], r: 'Infinite! Every answer is right because I love you 😘' }
    ];
    let i = 0;
    function show() {
      const q = qs[i];
      area.innerHTML = `<div class="quiz-q">${i + 1}/${qs.length} — ${q.q}</div>` +
        q.a.map((t, k) => `<button class="quiz-option" data-k="${k}">${t}</button>`).join('') +
        `<div class="result-msg" id="quizRes"></div>`;
      area.querySelectorAll('.quiz-option').forEach(b => b.addEventListener('click', ev => {
        $('quizRes').innerHTML = '<b>' + q.r + '</b>';
        burst(ev.clientX, ev.clientY, ['💖','💋','✨'], 8, 90);
        area.querySelectorAll('.quiz-option').forEach(x => x.disabled = true);
        later(() => {
          i++;
          if (i < qs.length) show();
          else { area.innerHTML = '<div class="result-msg"><b>Quiz complete! You scored 100% 💯💖</b><br>Because you are perfect 😘</div>'; confetti(80); }
        }, 1800);
      }));
    }
    show();
  }

  /* ---- Cake ---- */
  function cake(area, title) {
    title.textContent = 'Birthday Cake 🎂';
    let out = 0; const n = 5;
    area.innerHTML = `
      <div class="cake-stage">
        <div class="candles" id="candles">${'<span class="candle">🕯️</span>'.repeat(n)}</div>
        <div class="cake-emoji" id="cakeObj">🎂</div>
      </div>
      <div class="result-msg" id="cakeRes">Tap each candle to blow it out, then make a wish! ✨</div>`;
    area.querySelectorAll('.candle').forEach(c => c.addEventListener('click', ev => {
      if (c.classList.contains('out')) return;
      c.classList.add('out'); out++;
      burst(ev.clientX, ev.clientY, ['💨','✨'], 4, 50);
      if (out === n) {
        $('cakeRes').innerHTML = '<b>Your wish will come true! 🎉💖</b><br>Now tap the cake to cut it 🍰';
        confetti(100);
      }
    }));
    $('cakeObj').addEventListener('click', ev => {
      if (out < n) { $('cakeRes').textContent = 'Blow out all the candles first 🕯️💨'; return; }
      $('cakeObj').classList.remove('cut'); void $('cakeObj').offsetWidth;
      $('cakeObj').classList.add('cut'); $('cakeObj').textContent = '🍰';
      $('cakeRes').innerHTML = '<b>Yum! Wishing you the happiest birthday ever! 🎉💖</b>';
      burst(ev.clientX, ev.clientY, ['🍰','🎈','💖','🎉','💋'], 14, 140);
      confetti(80);
    });
  }

  /* ---- Love letter ---- */
  function letter(area, title) {
    title.textContent = 'A Letter For You 💌';
    area.innerHTML = `<div class="envelope" id="env">💌</div><div class="hint" id="envHint">Tap the envelope to open 💕</div><div class="letter" id="ltr" style="display:none"></div>`;
    const text = `මගේ රත්තරන්,

මම මේ ටික ඔයාට ලියන්නේ හදවතින්මයි. මගේ මුළු ජීවිත කාලෙම මට අඩුවක් වෙලා තිබ්බේ කාගෙන්වත් හරියට ආදරයක්, රැකවරණයක් ලැබුණේ නැති එක. පොඩි කාලේ ඉඳන්ම අම්මා තාත්තාගෙනවත්, වෙන කිසිම කෙනෙක්ගෙනවත් මට හරි හමන් ආදරයක් ලැබුණේ නෑ. ඒ නිසා මම ගත කළේ හරිම දුක්බර, තනිවුණු ජීවිතයක්. හැමදාම ප්‍රශ්න, දුක් විතරමයි මගේ වටේට තිබුණේ.

ඒත්... ඔයා මගේ ජීවිතේට ආවට පස්සේ ඒ හැමදේම වෙනස් වුණා. මගේ මුළු ජීවිතේම අඳුර නැතිවෙලා පාර එළිය වුණා වගේ මට දැනුණේ. මට මේ මුළු ලෝකෙන්ම ලැබුණේ නැති ආදරය, සෙනෙහස, අවධානය ඔයා මට එක මොහොතකින් දුන්නා. මගේ ජීවිතේ තිබ්බ ප්‍රශ්න, මානසික බර ඔක්කොම අඩු වුණේ ඔයා මගේ ළඟින් හිටපු නිසයි.

ඔයා මට පෙන්නපු ආදරේ නිසා මම ආයෙමත් හිනාවෙන්න ඉගෙන ගත්තා. ජීවත් වෙන්න ලොකු ආසාවක්, බලාපොරොත්තුවක් ඇතිවුණා. මාව තේරුම් අරන්, මගේ දුකේදීත් සතුටේදීත් මගේ ළඟින්ම ඉන්නවාට, මට මෙච්චර ආදරේ කරනවාට මම ඔයාට මගේ මුළු හදවතින්ම පින් දෙනවා.

ඔයා තමයි මගේ ජීවිතේට ලැබුණු ලොකුම ආශීර්වාදය. මගේ අවසාන හුස්ම තෙක්ම මම ඔයාව ඇස් දෙක වගේ බලාගන්නවා. මගේ ළඟින් මේ විදියටම හැමදාම ඉන්න මගේ රත්තරනේ...

මම ඔයාට ගොඩක් ආදරෙයි! ❤️`;
    let skip = false;
    $('env').addEventListener('click', async ev => {
      if ($('env').dataset.open) return; $('env').dataset.open = 1;
      $('env').textContent = '💖';
      $('envHint').textContent = 'Tap the letter to show it all at once';
      burst(ev.clientX, ev.clientY, ['💖','💋','💕','🎈'], 14, 130);
      const ltr = $('ltr'); ltr.style.display = 'block';
      ltr.addEventListener('click', () => { skip = true; });
      // split by grapheme so Sinhala letters never appear half-formed
      const seg = (typeof Intl !== 'undefined' && Intl.Segmenter)
        ? [...new Intl.Segmenter('si', { granularity: 'grapheme' }).segment(text)].map(s => s.segment)
        : [...text];
      const scroller = ltr.closest('.modal-content');
      let shown = '';
      for (const ch of seg) {
        if (!$('ltr')) return;               // modal closed
        shown += ch;
        if (skip) continue;
        ltr.textContent = shown;
        if (scroller) scroller.scrollTop = scroller.scrollHeight;
        await new Promise(r => setTimeout(r, ch === '\n' ? 200 : 40));
      }
      ltr.textContent = text;
      burst(window.innerWidth / 2, window.innerHeight / 2, ['💖','💋','💕','🎈','✨'], 22, 160);
      confetti(80);
    });
  }
})();
</script>
</body>
</html>
